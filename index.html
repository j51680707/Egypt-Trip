        function EgyptApp() {
          const [activeTab, setActiveTab] = useState('timeline'); // 'timeline' or 'map' or 'illustrations' or 'souvenirs'
          const [currentDay, setCurrentDay] = useState(1);
          const [isHeroOpen, setIsHeroOpen] = useState(true);
          
          // Weather state for Today/Tomorrow
          const [weatherData, setWeatherData] = useState({ 
            today: { temp: '--', condition: 'Loading', min: '--', max: '--' },
            tomorrow: { temp: '--', condition: 'Loading', min: '--', max: '--' }
          });
          
          const [weatherLastUpdated, setWeatherLastUpdated] = useState(''); // 新增天氣更新日期狀態
          const [rate, setRate] = useState('Loading...');
          const [exchangeRate, setExchangeRate] = useState(0.65);
          const [lastUpdated, setLastUpdated] = useState('');
          const [isRateModalOpen, setIsRateModalOpen] = useState(false);
          const [modalData, setModalData] = useState(null);
          const [isTipsOpen, setIsTipsOpen] = useState(false);
          
          // Refs for scrolling
          const timelineRef = useRef(null);

          const currentItinerary = itineraryData.find(d => d.day === currentDay);

          // Simulated API Calls & Weather Fetch
          useEffect(() => {
            if (!currentItinerary) return;

            // Fetch Weather
            const fetchWeather = async () => {
                try {
                    const { lat, lng } = currentItinerary.coords;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=auto`);
                    const data = await res.json();
                    
                    // WMO code map
                    const wmo = {
                        0: '晴朗', 1: '晴時多雲', 2: '多雲', 3: '陰天',
                        45: '霧', 48: '霧', 51: '毛毛雨', 53: '毛毛雨', 55: '毛毛雨',
                        61: '小雨', 63: '中雨', 65: '大雨', 80: '陣雨', 81: '陣雨', 82: '暴雨'
                    };

                    const getCond = (code) => wmo[code] || '晴朗';

                    setWeatherData({
                        today: {
                            temp: Math.round(data.current_weather.temperature),
                            condition: getCond(data.current_weather.weathercode),
                            min: Math.round(data.daily.temperature_2m_min[0]),
                            max: Math.round(data.daily.temperature_2m_max[0])
                        },
                        tomorrow: {
                            temp: Math.round((data.daily.temperature_2m_max[1] + data.daily.temperature_2m_min[1])/2),
                            condition: getCond(data.daily.weathercode[1]),
                            min: Math.round(data.daily.temperature_2m_min[1]),
                            max: Math.round(data.daily.temperature_2m_max[1])
                        }
                    });

                     const today = new Date();
                     setWeatherLastUpdated(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`);

                } catch (e) {
                    console.error("Weather fetch failed:", e);
                    // Fallback data if fetch fails
                     setWeatherData({
                        today: { temp: '32', condition: '晴朗', min: '20', max: '34' },
                        tomorrow: { temp: '33', condition: '晴朗', min: '21', max: '35' }
                     });
                }
            };
            
            fetchWeather();

            // Fetch Exchange Rate (Only needs to run once generally, but inside useEffect is fine)
            // Ideally move this to a separate useEffect if we want it to run only once on mount
          }, [currentItinerary]); // Depend on itinerary change for weather updates

          useEffect(() => {
             fetch('https://api.exchangerate-api.com/v4/latest/EGP')

                    const fetchedRate = data.rates.TWD;
                    setExchangeRate(fetchedRate);
                    setRate(`1 EGP ≈ ${fetchedRate.toFixed(2)} TWD`);
                    
                    const date = new Date(data.date);
                    setLastUpdated(data.date);

                    console.error("Rate fetch failed", err);
                    setRate('1 EGP ≈ 0.65 TWD');

                        onClick={() => handleDayChange(currentDay - 1)}
                        disabled={currentDay === 1}
                        className={`flex items-center gap-1 px-4 py-2 rounded-full shadow-sm text-sm font-bold transition-all ${
                            currentDay === 1
                                ? 'bg-gray-100 text-gray-300 cursor-not-allowed'
                                : 'bg-white text-blue-600 hover:bg-blue-50 hover:shadow-md active:scale-95'
                        }`}
                    >
                        <ChevronLeft size={16} /> 上一天
                    </button>

                    <button
                        onClick={() => handleDayChange(currentDay + 1)}
                        disabled={currentDay === itineraryData.length}
                        className={`flex items-center gap-1 px-4 py-2 rounded-full shadow-sm text-sm font-bold transition-all ${
                            currentDay === itineraryData.length
                                ? 'bg-gray-100 text-gray-300 cursor-not-allowed'
                                : 'bg-white text-blue-600 hover:bg-blue-50 hover:shadow-md active:scale-95'
                        }`}
                    >
                        下一天 <ChevronRight size={16} />
                    </button>
                </div>
              </div>
            </div>
          );

          const renderSchematicMap = () => (
            <div className="h-full bg-[#fcf9f2] flex flex-col">
               {/* Google Map Iframe */}
               <div className="w-full h-1/2 bg-gray-200 relative">
                  <iframe 
                    width="100%" 
                    height="100%" 
                    frameBorder="0" 
                    scrolling="no" 
                    marginHeight="0" 
                    marginWidth="0" 
                    src={`https://maps.google.com/maps?q=${currentItinerary.coords.lat},${currentItinerary.coords.lng}&hl=zh-TW&z=10&output=embed`}
                    title="Google Map"
                  ></iframe>
                  <div className="absolute bottom-2 right-2 bg-white/90 px-2 py-1 text-xs rounded shadow">
                    {currentItinerary.city}
                  </div>
               </div>

               {/* Schematic List */}
               <div className="flex-1 overflow-y-auto p-6 pb-24">
                  <h2 className="text-xl font-bold text-gray-800 mb-4">行程地圖導覽</h2>
                  <div className="relative border-l-2 border-yellow-400 ml-4 space-y-8">
                    {itineraryData.map((day) => (
                       <div 
                         key={day.day} 
                         className={`relative pl-6 cursor-pointer group transition-all ${currentDay === day.day ? 'opacity-100 scale-105' : 'opacity-60 hover:opacity-100'}`}
                         onClick={() => setCurrentDay(day.day)}
                       >
                         {/* Dot */}
                         <div className={`absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 border-white shadow ${currentDay === day.day ? 'bg-blue-600 scale-125' : 'bg-yellow-500'}`}></div>
                         
                         {/* Content */}
                         <div>
                           <span className="text-xs font-bold text-yellow-600 uppercase">Day {day.day}</span>
                           <h3 className="font-bold text-gray-800">{day.city.split('->')[0]}</h3>
                           <p className="text-xs text-gray-500 truncate">{day.title}</p>
                         </div>
                         
                         {/* Jump Button (only visible if active) */}
                         {currentDay === day.day && (
                           <button 
                             onClick={(e) => {
                               e.stopPropagation();
                               handleMapMarkerClick(day.day);
                             }}
                             className="mt-2 text-xs bg-blue-600 text-white px-3 py-1 rounded-full flex items-center gap-1 shadow-sm hover:bg-blue-700"
                           >
                             查看行程 <List size={12} />
                           </button>
                         )}
                       </div>
                    ))}
                  </div>
               </div>
            </div>
          );

          const renderIllustrations = () => (
            <div className="h-full bg-[#fcf9f2] pb-24 overflow-y-auto">
              <div className="p-4 space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">行程手繪插圖</h2>
                
                {/* Day 2-10 Map Illustration */}
                <div className="bg-white p-2 rounded-xl shadow-md overflow-hidden">
                   <h3 className="text-lg font-bold text-yellow-600 mb-2 px-2 flex items-center gap-2">
                     <Calendar size={20} />
                     手繪行程地圖 (Day 2-10)
                   </h3>
                   <img 
                     src="Egypt_Day_02-10_Map.png" 
                     alt="手繪行程地圖 (Day 2-10)" 
                     className="w-full h-auto rounded-lg object-contain bg-gray-100 min-h-[200px]"
                     onError={(e) => {
                       e.target.onerror = null; 
                       e.target.src='https://placehold.co/600x800/fcf9f2/333?text=Image+Not+Found%0A(Egypt_Day_02-10_Map.png)';
                     }}
                   />
                </div>

                {/* Day 1-6 Illustration */}
                <div className="bg-white p-2 rounded-xl shadow-md overflow-hidden">
                   <h3 className="text-lg font-bold text-yellow-600 mb-2 px-2 flex items-center gap-2">
                     <Calendar size={20} />
                     上篇：Day 1-6
                   </h3>
                   <img 
                     src="Egypt_Day_01-06.png" 
                     alt="Egypt Itinerary Day 1-6 Illustration" 
                     className="w-full h-auto rounded-lg object-contain bg-gray-100 min-h-[200px]"
                     onError={(e) => {
                       e.target.onerror = null; 
                       e.target.src='https://placehold.co/600x800/fcf9f2/333?text=Image+Not+Found%0A(Egypt_Day_01-06.png)';
                     }}
                   />
                </div>

                {/* Day 7-11 Illustration */}
                <div className="bg-white p-2 rounded-xl shadow-md overflow-hidden">
                   <h3 className="text-lg font-bold text-yellow-600 mb-2 px-2 flex items-center gap-2">
                     <Calendar size={20} />
                     下篇：Day 7-11
                   </h3>
                   <img 
                     src="Egypt_Day_07-11.png" 
                     alt="Egypt Itinerary Day 7-11 Illustration" 
                     className="w-full h-auto rounded-lg object-contain bg-gray-100 min-h-[200px]"
                     onError={(e) => {
                       e.target.onerror = null; 
                       e.target.src='https://placehold.co/600x800/fcf9f2/333?text=Image+Not+Found%0A(Egypt_Day_07-11.png)';
                     }}
                   />
                </div>

                <p className="text-center text-gray-400 text-sm italic">
                   * 圖片僅供參考，實際行程請以文字說明為準
                </p>
              </div>
            </div>
          );

          const renderSouvenirs = () => (
            <div className="h-full bg-[#fcf9f2] pb-24 overflow-y-auto">
              <div className="p-4 space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-2 px-2">埃及必買伴手禮</h2>
                <p className="text-sm text-gray-500 px-2 mb-4">把千年文明的回憶帶回家</p>
                
                <div className="grid grid-cols-1 gap-4">
                  {souvenirData.map((item) => (
                    <div key={item.id} className="bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                      <div className="h-40 w-full bg-gray-200 relative">
                         <img 
                            src={item.image} 
                            alt={item.name}
                            className="w-full h-full object-cover"
                            onError={(e) => {
                               e.target.onerror = null; 
                               e.target.src='https://placehold.co/600x400/f3f4f6/9ca3af?text=' + encodeURIComponent(item.name);
                            }}
                         />
                         <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3">
                           <h3 className="text-white font-bold text-lg">{item.name}</h3>
                         </div>
                      </div>
                      <div className="p-4">
                        <p className="text-gray-700 text-sm mb-3 leading-relaxed">{item.desc}</p>
                        <div className="bg-yellow-50 p-2 rounded border border-yellow-100 flex items-start gap-2">
                           <Info size={14} className="text-yellow-600 mt-1 shrink-0" />
                           <p className="text-xs text-yellow-800">{item.tips}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );

          const renderNumbers = () => (
            <div className="h-full bg-[#fcf9f2] pb-24 overflow-y-auto">
              <div className="p-4 space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-2 px-2">埃及數字對照表</h2>
                <p className="text-sm text-gray-500 px-2 mb-4">看懂車牌、價錢必備</p>
                
                <div className="bg-white p-4 rounded-xl shadow-md">
                   <img 
                     src="EGYPT_NUMBER.jpg" 
                     alt="埃及數字對照表" 
                     className="w-full h-auto rounded-lg object-contain"
                     onError={(e) => {
                       e.target.onerror = null; 
                       e.target.src='https://placehold.co/600x800/fcf9f2/333?text=Image+Not+Found%0A(EGYPT_NUMBER.jpg)';
                     }}
                   />
                   <div className="mt-4 text-sm text-gray-600 space-y-2">
                      <p>上排：阿拉伯文數字 (埃及通用)</p>
                      <p>下排：我們熟悉的阿拉伯數字</p>
                      <p className="text-xs text-gray-400 mt-2">* 埃及雖然主要使用阿拉伯文，但在觀光區也會標示我們熟悉的數字。學會辨識這 0-9 個符號，對於看車牌、商店標價非常有幫助！</p>
                   </div>
                </div>
              </div>
            </div>
          );

          return (
            <div className="max-w-md mx-auto h-screen bg-gray-50 flex flex-col relative font-sans text-gray-900 overflow-hidden border-x border-gray-200 shadow-2xl">
              
              {/* 1. Hero Section - Collapsible Drawer Style */}
              <div 
                className={`bg-slate-900 bg-cover bg-center text-white transition-all duration-300 ease-in-out z-20 shadow-md flex flex-col shrink-0 ${isHeroOpen ? 'max-h-80' : 'max-h-[84px]'}`}
                style={{ backgroundImage: `url('Egypt_Banner.png')` }}
              >
                {/* ... existing hero content ... */}
                <div className="bg-black/40 w-full h-full flex flex-col">
                  <div className="p-4 flex-1 overflow-hidden">
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-2">
                         <span className="bg-yellow-500 text-xs font-bold px-2 py-0.5 rounded text-black">EGYPT</span>
                         <h1 className="font-bold text-lg tracking-wide drop-shadow-md">尼羅河傳說 {itineraryData.length} 日遊</h1>
                      </div>
                      <div className="flex gap-3">
                         <button onClick={() => setIsTipsOpen(true)} className="bg-black/30 backdrop-blur-sm p-2 rounded-full hover:bg-black/50 transition-colors border border-white/20">
                            <span className="text-sm font-bold">🇹🇼 TIPS</span>
                         </button>
                      </div>
                    </div>

                    {/* Collapsible Content */}
                    <div className={`mt-4 space-y-4 transition-opacity duration-300 ${isHeroOpen ? 'opacity-100' : 'opacity-0'}`}>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-black/40 rounded-lg p-2 backdrop-blur-sm border border-white/10">
                          <div className="flex items-center text-yellow-400 mb-1">
                            <Sun size={14} className="mr-1" />
                            <span className="text-xs font-bold">當地天氣 ({currentItinerary.city.split('->')[0]})</span>
                          </div>
                          
                          <div className="flex divide-x divide-white/20">
                            {/* Today */}
                            <div className="flex-1 pr-2">
                               <div className="text-[10px] text-gray-300">今天</div>
                               <div className="text-xl font-bold">{weatherData.today.temp}°C</div>
                               <div className="text-[10px] text-gray-300">{weatherData.today.condition}</div>
                               <div className="text-[9px] text-gray-400">{weatherData.today.min}°-{weatherData.today.max}°</div>
                            </div>
                            {/* Tomorrow */}
                            <div className="flex-1 pl-2">
                               <div className="text-[10px] text-gray-300">明天</div>
                               <div className="text-xl font-bold">{weatherData.tomorrow.temp}°C</div>
                               <div className="text-[10px] text-gray-300">{weatherData.tomorrow.condition}</div>
                               <div className="text-[9px] text-gray-400">{weatherData.tomorrow.min}°-{weatherData.tomorrow.max}°</div>
                            </div>
                          </div>
                          
                          <div className="text-[9px] text-gray-500 mt-1 text-right">更新: {weatherLastUpdated}</div>
                        </div>

                        <div 
                            className="bg-black/40 rounded-lg p-3 backdrop-blur-sm border border-white/10 cursor-pointer active:scale-95 transition-transform"
                            onClick={() => setIsRateModalOpen(true)}
                        >
                          <div className="flex items-center text-green-400 mb-1">
                            <DollarSign size={16} className="mr-1" />
                            <span className="text-xs font-bold">參考匯率 (點擊換算)</span>
                          </div>
                          <div className="text-sm font-medium mt-1">{rate}</div>
                          <div className="text-[10px] text-gray-400 mt-1">請準備小額美金</div>
                        </div>
                      </div>
                      
                      <div className="flex items-center text-xs text-gray-300 bg-black/30 w-fit px-2 py-1 rounded backdrop-blur-sm">
                         <MapPin size={12} className="mr-1" /> 
                         <span>現在位置: {activeTab === 'timeline' ? itineraryData[currentDay-1].city : '全覽模式'}</span>
                      </div>
                    </div>
                  </div>

                  {/* Toggle Handle Bar */}
                  <button 
                     onClick={() => setIsHeroOpen(!isHeroOpen)}
                     className="h-6 w-full flex items-center justify-center bg-black/40 hover:bg-black/60 transition-colors cursor-pointer active:bg-black/70 border-t border-white/10 backdrop-blur-sm"
                  >
                     {isHeroOpen ? <ChevronUp size={16} className="text-white/80" /> : <ChevronDown size={16} className="text-white/80" />}
                  </button>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="flex-1 overflow-y-auto bg-gray-50 relative scroll-smooth">
                {activeTab === 'timeline' ? renderTimeline() : 
                 activeTab === 'map' ? renderSchematicMap() : 
                 activeTab === 'illustrations' ? renderIllustrations() :
                 activeTab === 'souvenirs' ? renderSouvenirs() :
                 renderNumbers()}
              </div>

              {/* 3. Bottom Navigation */}
              <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-1 py-3 flex justify-around items-center z-30 pb-safe">
                <button 
                  onClick={() => setActiveTab('timeline')}
                  className={`flex flex-col items-center gap-1 min-w-[50px] transition-colors ${activeTab === 'timeline' ? 'text-yellow-600' : 'text-gray-400'}`}
                >
                  <List size={20} />
                  <span className="text-[9px] font-bold">每日行程</span>
                </button>
                
                <button 
                  onClick={() => setActiveTab('illustrations')}
                  className={`flex flex-col items-center gap-1 min-w-[50px] transition-colors ${activeTab === 'illustrations' ? 'text-yellow-600' : 'text-gray-400'}`}
                >
                  <ImageIcon size={20} />
                  <span className="text-[9px] font-bold">行程插圖</span>
                </button>

                {/* Floating Action Button Style Center */}
                <div className="relative -top-5">
                  <button 
                     className="w-12 h-12 bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-full shadow-xl flex items-center justify-center text-white border-4 border-gray-50 transform active:scale-95 transition-transform"
                     onClick={() => {
                        setActiveTab('timeline');
                        setCurrentDay(1); // Reset to day 1 or current real date logic
                     }}
                  >
                     <Plane size={20} />
                  </button>
                </div>

                <button 
                  onClick={() => setActiveTab('souvenirs')}
                  className={`flex flex-col items-center gap-1 min-w-[50px] transition-colors ${activeTab === 'souvenirs' ? 'text-yellow-600' : 'text-gray-400'}`}
                >
                  <ShoppingBag size={20} />
                  <span className="text-[9px] font-bold">伴手禮</span>
                </button>

                <button 
                  onClick={() => setActiveTab('numbers')}
                  className={`flex flex-col items-center gap-1 min-w-[50px] transition-colors ${activeTab === 'numbers' ? 'text-yellow-600' : 'text-gray-400'}`}
                >
                  <Hash size={20} />
                  <span className="text-[9px] font-bold">埃及數字</span>
                </button>

                <button 
                  onClick={() => setActiveTab('map')}
                  className={`flex flex-col items-center gap-1 min-w-[50px] transition-colors ${activeTab === 'map' ? 'text-yellow-600' : 'text-gray-400'}`}
                >
                  <MapIcon size={20} />
                  <span className="text-[9px] font-bold">總覽地圖</span>
                </button>
              </div>

              {/* Modals */}
              {/* ... existing modals ... */}
              <Modal 
                isOpen={!!modalData} 
                data={modalData} 
                onClose={() => setModalData(null)} 
              />
              
              <TipsModal 
                isOpen={isTipsOpen} 
                onClose={() => setIsTipsOpen(false)} 
              />

              <RateModal
                isOpen={isRateModalOpen}
                onClose={() => setIsRateModalOpen(false)}
                rate={exchangeRate}
                lastUpdate={lastUpdated}
              />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EgyptApp />);
    </script>
</body>
</html>
